<div class="layout-wrapper">
    <!-- Header -->
    <mat-toolbar color="primary" class="header mat-elevation-z4">
        <button mat-icon-button (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <span>{{ group()?.groupName || 'Ride Details' }}</span>
    </mat-toolbar>

    <!-- Map Container -->
    <div class="map-wrapper">
        <div id="rideMap" class="leaflet-map"></div>

        <!-- Floating Recenter Button -->
        <button mat-fab color="accent" class="recenter-fab" (click)="recenterToDestination()"
            title="Recenter to Destination">
            <mat-icon>my_location</mat-icon>
        </button>

        <!-- Bottom Action Panel -->
        <div class="bottom-panel mat-elevation-z8">
            <div class="panel-content">
                <div class="info">
                    <h3>Destination</h3>
                    <p>
                        Lat: {{ group()?.destinationLat | number:'1.4-4' }} |
                        Lng: {{ group()?.destinationLong | number:'1.4-4' }}
                    </p>
                </div>
                <button mat-raised-button [color]="isSharing() ? 'warn' : 'primary'" (click)="toggleLocationSharing()">
                    <mat-icon>{{ isSharing() ? 'stop_circle' : 'share_location' }}</mat-icon>
                    {{ isSharing() ? 'Stop Sharing' : 'Share Location' }}
                </button>
            </div>
        </div>
    </div>
</div>
