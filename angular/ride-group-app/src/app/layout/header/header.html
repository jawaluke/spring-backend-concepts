<mat-toolbar color="primary" class="header-toolbar">
  <!-- Brand / Logo -->
  <span class="brand-title" (click)="goToHome()">{{ applicationName }}</span>

  <!-- Spacer to push navigation to the right -->
  <span class="toolbar-spacer"></span>

  <!-- Desktop Navigation Items -->
  <div class="nav-links">
    <button mat-button>Home</button>
    <button mat-button>Dashboard</button>
    <button mat-button>Settings</button>
  </div>

  <!-- User Profile Action Menu -->
  <button mat-icon-button [matMenuTriggerFor]="profileMenu" aria-label="User profile menu">
    <mat-icon>account_circle</mat-icon>
  </button>
  
  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item>
      <mat-icon>person</mat-icon>
      <span (click)="navigateToLop()">My Profile</span>
    </button>
    <button mat-menu-item>
      <mat-icon>exit_to_app</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
